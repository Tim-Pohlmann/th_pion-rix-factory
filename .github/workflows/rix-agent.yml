name: rix (agent)
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Task for the agent
        required: true
      repo:
        description: "Target repo name; the owner is always Tim-Pohlmann; defaults to this repo"
        required: false
jobs:
  rix:
    uses: Tim-Pohlmann/rix/.github/workflows/agent.yml@v0
    with:
      # Any repo read-token reaches; the PR only opens where write-token can push.
      repo: Tim-Pohlmann/${{ inputs.repo || github.event.repository.name }}
      prompt: ${{ inputs.prompt }}
      # Copies this repo's .rix/agent-home into the runner's home before the agent starts. The run
      # fails while that directory is missing.
      factory-repo: ${{ github.repository }}
      agent: claude
      agent-api-key-env: CLAUDE_CODE_OAUTH_TOKEN
    secrets:
      read-token: ${{ secrets.RIX_READ_TOKEN }}
      write-token: ${{ secrets.RIX_WRITE_TOKEN }}
      agent-api-key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
